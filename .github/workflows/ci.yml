name: CI - Code Quality & Tests

# Trigger on push to dev/main branches and pull requests to main
on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black bandit pytest-cov
    
    - name: Set test environment variables
      run: |
        echo "CI=true" >> $GITHUB_ENV
        echo "TESTING=true" >> $GITHUB_ENV
        mkdir -p /tmp
        echo '{"type": "service_account", "project_id": "test"}' > /tmp/test-creds.json
    
    - name: Run flake8 linting
      run: |
        echo "Running flake8 linting..."
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --max-line-length=130 --statistics
      continue-on-error: false
    
    - name: Check code formatting with black
      run: |
        echo "Checking code formatting..."
        black --check src/ tests/
      continue-on-error: false
    
    - name: Run pytest with coverage
      run: |
        echo "Running tests with coverage..."
        pytest tests/ -v --tb=short --maxfail=5 --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=50
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
      
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Bandit
      run: pip install bandit[toml]
    
    - name: Run Bandit security scan
      run: |
        echo "Running security scan..."
        bandit -r src/ -ll -f screen || echo "Security issues found"
        bandit -r src/ -ll -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: bandit-report.json
        retention-days: 30

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Set test environment variables
      run: |
        echo "CI=true" >> $GITHUB_ENV
        echo "TESTING=true" >> $GITHUB_ENV
        mkdir -p /tmp
        echo '{"type": "service_account", "project_id": "test"}' > /tmp/test-creds.json
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Setup Google Cloud credentials
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        chmod 600 /tmp/gcp-key.json
    
    - name: Set production environment variables
      run: |
        echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        echo "BQ_DATASET=${{ secrets.BQ_DATASET }}" >> $GITHUB_ENV
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
    
    - name: Validate environment variables
      run: |
        python -c "
        import os
        required_vars = [
            'GCP_PROJECT_ID', 'BQ_DATASET', 'GOOGLE_APPLICATION_CREDENTIALS']
        missing = [v for v in required_vars if not os.getenv(v)]
        if missing:
            print(f' Missing required environment variables: {missing}')
            exit(1)
        print(' All required environment variables are set')
        "
    - name: Verify imports
      run: |
        python -c "
        from src.config import PROJECT_ID, DATASET_ID
        from src.bigquery_client import BigQueryClient
        from src.data_loader import DataLoader
        from src.metadata_manager import MetadataManager
        from src.orchestrator import PipelineOrchestrator
        from src.retry_handler import RetryHandler
        print('All imports successful')
        "   
    
    - name: Validate SQL files
      run: |
        echo "Checking SQL files exist..."
        test -f sql/create_metadata_table.sql || (echo "Missing create_metadata_table.sql" && exit 1)
        test -f sql/create_staging_table.sql || (echo "Missing create_staging_table.sql" && exit 1)
        test -f sql/create_raw_table.sql || (echo "Missing create_raw_table.sql" && exit 1)
        test -f sql/create_silver_table.sql || (echo "Missing create_silver_table.sql" && exit 1)
        test -f sql/create_gold_table.sql || (echo "Missing create_gold_table.sql" && exit 1)
        echo "All SQL files present"

  report-status:
    name: CI Summary
    needs: [lint-and-test, security-scan, build-validation]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Report CI Results
      run: |
        echo "================================================"
        echo "          CI/CD PIPELINE RESULTS                "
        echo "================================================"
        echo "Lint & Test:       ${{ needs.lint-and-test.result }}"
        echo "Security Scan:     ${{ needs.security-scan.result }}"
        echo "Build Validation:  ${{ needs.build-validation.result }}"
        echo "Timestamp:         $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        echo "================================================"
        echo ""
        
        # Check if critical jobs passed (security-scan can be skipped)
        if [ "${{ needs.lint-and-test.result }}" == "success" ] && \
           [ "${{ needs.build-validation.result }}" == "success" ]; then
          echo "All critical CI checks passed! Safe to merge."
          exit 0
        else
          echo "Some CI checks failed. Please review and fix."
          echo ""
          echo "Failed jobs:"
          [ "${{ needs.lint-and-test.result }}" != "success" ] && echo "  - Lint & Test"
          [ "${{ needs.build-validation.result }}" != "success" ] && echo "  - Build Validation"
          exit 1
        fi
