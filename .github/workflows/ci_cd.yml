name: NYC Taxi Pipeline CI/CD

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily 
    - cron: '35 20 * * *'
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black bandit pytest-cov
    
    - name: Set test environment variables
      run: |
        echo "CI=true" >> $GITHUB_ENV
        echo "TESTING=true" >> $GITHUB_ENV
        mkdir -p /tmp
        echo '{"type": "service_account", "project_id": "test"}' > /tmp/test-creds.json

    - name: Setup Google Cloud credentials
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        chmod 600 /tmp/gcp-key.json
    
    - name: Set production environment variables
      run: |
        echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        echo "BQ_DATASET=${{ secrets.BQ_DATASET }}" >> $GITHUB_ENV
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
            
    - name: Run flake8 linting
      run: |
        echo "Running flake8 linting..."
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --max-line-length=130 --statistics
      continue-on-error: false
    
    - name: Check code formatting with black
      run: |
        echo "Checking code formatting..."
        black --check src/ tests/
      continue-on-error: false
    
    - name: Run pytest with coverage
      run: |
        echo "Running tests with coverage..."
        pytest tests/ -v --tb=short --maxfail=5 --cov=src --cov-report=term-missing --cov-fail-under=50
      
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Bandit
      run: pip install bandit[toml]
    
    - name: Run Bandit security scan
      run: |
        echo "Running security scan..."
        bandit -r src/ -ll -f screen || echo "Security issues found"
        bandit -r src/ -ll -f json -o bandit-report.json || true
      continue-on-error: true
    
  create-tables:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Setup Google Cloud credentials
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        chmod 600 /tmp/gcp-key.json
    
    - name: Set production environment variables
      run: |
        echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        echo "BQ_DATASET=${{ secrets.BQ_DATASET }}" >> $GITHUB_ENV
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
    
    - name: Validate environment variables
      run: |
        python -c "
        import os
        required_vars = [
            'GCP_PROJECT_ID', 'BQ_DATASET', 'GOOGLE_APPLICATION_CREDENTIALS']
        missing = [v for v in required_vars if not os.getenv(v)]
        if missing:
            print(f' Missing required environment variables: {missing}')
            exit(1)
        print(' All required environment variables are set')
        "
    
    - name: Create BigQuery tables
      run: |
        python -m src.create_tables
      timeout-minutes: 10
    
    - name: Verify table creation
      run: |
        python -c "
        from src.bigquery_client import BigQueryClient
        from src.config import (
            STAGING_TABLE, RAW_TABLE, METADATA_TABLE
        )
        
        client = BigQueryClient()
        tables = [STAGING_TABLE, RAW_TABLE, METADATA_TABLE]
        
        for table in tables:
            full_table_id = table
            if client.table_exists(full_table_id):
                print(f' Table {full_table_id} exists')
            else:
                print(f' Table {full_table_id} not found')
                exit(1)
        
        print(' All required tables verified')
        "
    
    - name: Cleanup credentials
      if: always()
      run: |
        rm -f /tmp/gcp-key.json

  run-pipeline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [create-tables]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Setup Google Cloud credentials
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        chmod 600 /tmp/gcp-key.json
    
    - name: Set production environment variables
      run: |
        echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        echo "BQ_DATASET=${{ secrets.BQ_DATASET }}" >> $GITHUB_ENV
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
    
    - name: Pre-flight checks
      run: |
        python -c "
        from src.bigquery_client import BigQueryClient
        from src.metadata_manager import MetadataManager
        
        client = BigQueryClient()
        print('BigQuery connection successful')
        
        metadata = MetadataManager(client)
        print('Metadata manager initialized')
        "
    
    - name: Run incremental pipeline
      run: |
        python run_incremental.py
      timeout-minutes: 45
    
    - name: Verify pipeline execution
      run: |
        python -c "
        from src.bigquery_client import BigQueryClient
        from src.metadata_manager import MetadataManager
        from src.config import STATUS_SUCCESS
        
        client = BigQueryClient()
        metadata = MetadataManager(client)
        last_run = metadata.get_last_successful_run('incremental')
        
        if not last_run:
            print(' No successful pipeline run found (might be first run)')
        else:
            if last_run.get('status') == STATUS_SUCCESS:
                print('Pipeline executed successfully')
                print(f'Last run: {last_run.get(\"run_timestamp\")}')
                print(f'Rows loaded: {last_run.get(\"rows_loaded\")}')
            else:
                print(f' Pipeline status: {last_run.get(\"status\")}')
        "
      continue-on-error: true
    
    - name: Cleanup credentials
      if: always()
      run: |
        rm -f /tmp/gcp-key.json
    
    - name: Upload pipeline logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-logs
        path: logs/
        retention-days: 30

  notify:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Report results
      run: |
        LINT_RESULT="${{ needs.lint-and-test.result }}"
        SECURITY_RESULT="${{ needs.security-scan.result }}"
        
        echo "CI/CD Results:"
        echo "  Lint & Test: $LINT_RESULT"
        echo "  Security Scan: $SECURITY_RESULT"
        echo "  Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        echo ""
        
        if [ "$LINT_RESULT" == "success" ] && [ "$SECURITY_RESULT" == "success" ]; then
          echo "All checks passed!"
          exit 0
        elif [ "$LINT_RESULT" == "success" ]; then
          echo "Tests passed but security scan had issues"
          exit 0
        else
          echo "Some checks failed"
          exit 1
        fi
