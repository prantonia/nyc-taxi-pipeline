name: NYC Taxi Pipeline CI/CD

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC
  workflow_dispatch:

# SETUP JOB (shared by all jobs)
jobs:
  setup:
    name: Shared Setup Environment
    runs-on: ubuntu-latest

    outputs:
      creds-path: ${{ steps.creds.outputs.creds_path }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black bandit pytest pytest-cov

    - name: Create GCP Credentials File
      id: creds
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        chmod 600 /tmp/gcp-key.json
        echo "creds_path=/tmp/gcp-key.json" >> "$GITHUB_OUTPUT"

    - name: Export Shared Environment Variables
      run: |
        {
          echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}";
          echo "BQ_DATASET=${{ secrets.BQ_DATASET }}";
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json";
        } >> $GITHUB_ENV
    
    - name: Cleanup credentials
      if: always()
      run: |
        rm -f /tmp/gcp-key.json
    
# LINT AND TEST
  lint-and-test:
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Use Code
      uses: actions/checkout@v4

    - name: Run flake8 linting
      run: |
        echo "Running flake8 linting..."
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --max-line-length=130 --statistics
      continue-on-error: false

    - name: Check code formatting with black
      run: |
        echo "Checking code formatting..."
        black --check src/ tests/
      continue-on-error: false

    - name: Run pytest with coverage
      run: |
        echo "Running tests with coverage..."
        pytest tests/ -v --tb=short --maxfail=5 --cov=src --cov-report=term-missing --cov-fail-under=50

# SECURITY SCAN
  security-scan:
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Security Scan (Bandit)
      run: bandit -r src -ll

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 30

# CREATE BIGQUERY TABLES
  create-tables:
    needs: [setup, lint-and-test, security-scan]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create BigQuery tables
      run: python -m src.create_tables

    - name: Verify Tables
      run: |
        python - << 'EOF'
        from src.bigquery_client import BigQueryClient
        from src.config import STAGING_TABLE, RAW_TABLE, METADATA_TABLE
        
        client = BigQueryClient()
        for table in [STAGING_TABLE, RAW_TABLE, METADATA_TABLE]:
            if client.table_exists(table):
                print(f"Table exists: {table}")
            else:
                print(f"Missing table: {table}")
                exit(1)
        EOF

    - name: Upload Log Files
      uses: actions/upload-artifact@v4
      with:
        name: table-creation-logs
        path: logs/
        retention-days: 7

# RUN INCREMENTAL PIPELINE
  run-pipeline:
    needs: create-tables
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Incremental Pipeline
      run: python run_incremental.py

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-logs
        path: logs/
        retention-days: 30

# 6. FINAL STATUS NOTIFICATION
  notify:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Print Results
      run: |
        echo "Lint/Test Result: ${{ needs.lint-and-test.result }}"
        echo "Security Scan Result: ${{ needs.security-scan.result }}"
        echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
