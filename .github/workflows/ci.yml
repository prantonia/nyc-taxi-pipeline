name: CI - Code Quality & Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  CI: true
  TESTING: true
  GCP_PROJECT_ID: test-project-id
  BQ_DATASET: test_dataset
  STAGING_TABLE_NAME: test_staging_table

jobs:

  lint-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-${{ matrix.python-version }}-pip-

    - name: Create test credentials
      run: |
        mkdir -p /tmp
        echo '{"type": "service_account", "project_id": "test-project-id"}' > /tmp/test-creds.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/test-creds.json" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black bandit pytest-cov

    - name: Run flake8 linting
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --max-line-length=130 --statistics

    - name: Check formatting with Black
      run: black --check src/ tests/

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short --maxfail=5 --cov=src \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=50

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./coverage.xml
        flags: unittests
        name: python-${{ matrix.python-version }}
        fail_ci_if_error: false


  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: pip install bandit[toml]

    - name: Run Bandit scan
      run: |
        bandit -r src/ -ll -f json -o bandit-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
        retention-days: 30


  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Create test credentials
      run: |
        mkdir -p /tmp
        echo '{"type": "service_account", "project_id": "test-project-id"}' > /tmp/test-creds.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/test-creds.json" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify imports
      run: |
        python - <<'EOF'
            from src.config import PROJECT_ID, DATASET_ID
            from src.bigquery_client import BigQueryClient
            from src.data_loader import DataLoader
            from src.metadata_manager import MetadataManager
            from src.orchestrator import PipelineOrchestrator
            from src.retry_handler import RetryHandler
            print("All imports successful")
            print("PROJECT_ID:", PROJECT_ID)
            print("DATASET_ID:", DATASET_ID)
            EOF

    - name: Validate SQL files exist
      run: |
        for file in sql/create_metadata_table.sql \
                    sql/create_staging_table.sql \
                    sql/create_raw_table.sql \
                    sql/create_silver_table.sql \
                    sql/create_gold_table.sql; do
          test -f "$file" || { echo "Missing $file"; exit 1; }
        done


  summary:
    name: CI Summary
    needs: [lint-test, security, build-validation]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Output Summary
      run: |
        echo "====== CI SUMMARY ======"
        echo "Lint & Test:      ${{ needs.lint-test.result }}"
        echo "Security Scan:    ${{ needs.security.result }}"
        echo "Build Validation: ${{ needs.build-validation.result }}"
        echo "========================"

        if [ "${{ needs.lint-test.result }}" == "success" ] && \
           [ "${{ needs.build-validation.result }}" == "success" ]; then
          echo "All critical checks passed!"
          exit 0
        else
          echo "Some checks failed."
          exit 1
        fi
